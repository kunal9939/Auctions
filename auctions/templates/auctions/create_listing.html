{% extends "auctions/layout.html" %}

{% block title %}
    Create Listings
{% endblock %}

{% block body %}
    <form action="{% url 'create_listing' %}" method="post">
        {% csrf_token %}
        <input class="form-control" type="text" name="title" placeholder="Title" required>
        <textarea class="form-control" name="description" placeholder="Description" required></textarea>
        <input class="form-control" type="number" name="price" placeholder="Price" step="0.01" min="0.01" required>
        <input class="form-control" type="url" name="image_url" placeholder="Image URL">
        <select class="form-control" name="category">
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category }}</option>
            {% endfor %}
        </select>
        <input class="btn btn-primary" type="submit" value="Create Listing">
    </form>
{% endblock %}
